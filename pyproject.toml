[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-crop-health"
version = "0.1.0"
description = "Rule-based multispectral crop vigor and anomaly monitoring using Blue, Green, Red and NIR bands."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ViTA Team"}]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]
all = ["rasterio>=1.3", "matplotlib>=3.7", "pytest>=7.4"]

[project.scripts]
vita-crop-health = "vita_crop_health.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
